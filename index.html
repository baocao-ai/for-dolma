<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1f4a">
<title>Dolma Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 7' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff8fc0' d='M1 0h2v1H1zM5 0h2v1H5zM0 1h8v3H0zM1 4h6v1H1zM2 5h4v1H2zM3 6h2v1H3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Start: enter the date code -->
  <section data-screen="start" class="start">
    <svg class="heart-px" viewBox="0 0 8 7" shape-rendering="crispEdges" aria-hidden="true">
      <path fill="#3b2a5a" d="M1 0h2v1H1zM5 0h2v1H5zM0 1h1v3H0zM3 1h2v1H3zM7 1h1v3H7zM1 4h1v1H1zM6 4h1v1H6zM2 5h1v1H2zM5 5h1v1H5zM3 6h2v1H3z"/>
      <path fill="#ff8fc0" d="M1 1h2v1H1zM5 1h2v1H5zM1 2h6v2H1zM2 4h4v1H2zM3 5h2v1H3z"/>
      <path fill="#fff" d="M1 1h1v1H1z"/>
    </svg>
    <h1 class="title">DOLMA<br>ARCADE<small>♥ 1 PLAYER ♥</small></h1>
    <p class="hint">Enter our special date to play</p>
    <form id="code-form" autocomplete="off">
      <div class="code" id="code"></div>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="btn" id="press" type="submit">PRESS START</button>
    </form>
    <p class="coin blink">INSERT COIN ♥</p>
  </section>

  <!-- Hub: pick a game -->
  <section data-screen="hub" hidden>
    <div class="hud">
      <span>P1: <span id="player">DOLMA</span></span>
      <span class="hearts" id="hearts" aria-label="Games cleared"></span>
      <button class="mute" id="mute" type="button" aria-label="Sound on/off">🔊</button>
    </div>
    <h2 class="hub-title">PICK A GAME!</h2>
    <div class="cabinets" id="cabinets"></div>
    <div class="meter">
      <div class="bar"><div class="fill" id="meter-fill"></div></div>
      <p id="meter-text"></p>
    </div>
  </section>

  <!-- One game at a time renders into #game-body -->
  <section data-screen="game" hidden>
    <div class="game-top">
      <button class="back" id="back" type="button">◀ BACK</button>
      <span class="status" id="status"></span>
    </div>
    <h2 class="game-title" id="game-title"></h2>
    <div id="game-body"></div>
  </section>

  <!-- Finale: all four cleared -->
  <section data-screen="finale" class="finale-screen" hidden>
    <div class="game-top">
      <button class="back" id="finale-back" type="button">◀ ARCADE</button>
      <span class="status">★★★★</span>
    </div>
    <p class="hs">HIGH SCORE!</p>
    <div class="hs-table">
      <div class="me"><span>1ST <span id="hs-name">DOLMA</span> ♥</span><span>999999</span></div>
      <div><span>2ND EVERYONE ELSE</span><span>000000</span></div>
    </div>
    <div class="window letter">
      <p class="letter-title">A NOTE FOR P1</p>
      <div id="letter"></div>
    </div>
    <p class="gallery-title">ALL OUR MEMORIES</p>
    <div class="gallery" id="gallery"></div>
    <div class="finale-actions">
      <button class="btn alt small" id="replay" type="button">PLAY AGAIN</button>
    </div>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <b class="modal-title" id="modal-title"></b>
      <img class="modal-img" id="modal-img" alt="">
      <p class="modal-date" id="modal-date"></p>
      <p class="modal-cap" id="modal-cap"></p>
      <button class="btn" id="modal-ok" type="button">YAY ♥</button>
    </div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
